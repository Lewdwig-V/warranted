# The M5 configuration migration under its initial contract.
id = "config-migration-proof"
objective = """Read README.md and change only migrate.py. Write result.json as {"migrate.py": "<source>"}, and Solution.lean proving Warranted.migration_renaming from renaming.md, then submit."""
checks = ["migration", "renaming"]

[inputs]
"README.md" = "../../m5/fixture/seed/README.md"
"settings.json" = "../../m5/fixture/seed/settings.json"
"migrate.py" = "../../m5/fixture/seed/migrate.py"
"modern_consumer.py" = "../../m5/fixture/seed/modern_consumer.py"
"legacy_consumer.py" = "../../m5/fixture/seed/legacy_consumer.py"
"example_test.py" = "../../m5/fixture/seed/example_test.py"
"renaming.md" = "MigrationChallenge.lean"

[private]
"references.json" = "../../m5/fixture/references.json"
"contract.json" = "contract-initial.json"

[budgets]
submissions = 3
