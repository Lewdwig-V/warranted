[project]
name = "warranted"
version = "0.1.0a0"
description = "Durable, checkable knowledge for long-horizon agent work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "mini-swe-agent==2.4.6",
]

[project.scripts]
warranted = "warranted.cli:main"

[project.urls]
Repository = "https://github.com/Lewdwig-V/warranted"
Issues = "https://github.com/Lewdwig-V/warranted/issues"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
markers = [
    "container: requires rootless Podman and the pinned local image",
    "proof: requires rootless Podman and the pinned Lean verifier bundle",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
