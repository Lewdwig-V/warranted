[project]
name = "warranted"
version = "0.1.0a0"
description = "Durable, checkable knowledge for long-horizon agent work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
warranted = "warranted.cli:main"

[project.urls]
Repository = "https://github.com/Lewdwig-V/warranted"
Issues = "https://github.com/Lewdwig-V/warranted/issues"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
