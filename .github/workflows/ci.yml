name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Install Python and project
        run: |
          uv python install
          uv sync --locked
      - name: Check source
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Test persistence, exports, and fixtures
        run: uv run --locked pytest -q tests
      - name: Run the CSV walkthrough across two processes
        id: walkthrough
        run: |
          uv run --locked python examples/m1/walkthrough.py start runs/m1-ci
          uv run --locked python examples/m1/walkthrough.py resume runs/m1-ci
      - name: Retain permitted walkthrough evidence
        if: ${{ always() && steps.walkthrough.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-walkthrough
          path: |
            runs/m1-ci/exports/
            runs/m1-ci/reports/
            runs/m1-ci/candidate/executions.log
          if-no-files-found: error
          retention-days: 14
      - name: Run all three M2 experiments across two processes
        id: m2
        run: |
          uv run --locked python examples/m2/experiments.py start runs/m2-ci
          uv run --locked python examples/m2/experiments.py resume runs/m2-ci
      - name: Retain M2 development fixture evidence
        if: ${{ always() && steps.m2.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-experiments
          path: |
            runs/m2-ci/*/exports/
            runs/m2-ci/*/reports/
            runs/m2-ci/*/executions.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Check entry points
        run: |
          uv run --locked warranted --help
          uv run --locked warranted --version
          uv run --locked python -m warranted --version
      - name: Build and install the wheel
        run: |
          uv build --no-sources
          uv venv .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/warranted --version
          .venv-wheel/bin/python -c "from warranted.ledger import Ledger, Request, Result"
          .venv-wheel/bin/python -c "from warranted.exports import export_evidence"
          .venv-wheel/bin/python -c "from warranted.acceptance import Acceptance, AcceptanceContext, Evidence"
          .venv-wheel/bin/python -c "from warranted.claims import Claims, Assessment, Applicability"
          .venv-wheel/bin/python -c "from warranted.worker import Episode, run_workflow"
          .venv-wheel/bin/python -c "from warranted.contexts import Condition, capture_context, capture_history"
          .venv-wheel/bin/python -c "from warranted.proofs import RESOURCES; assert all((RESOURCES / name).is_file() for name in ('Challenge.lean', 'Migration.lean', 'Timestamp.lean', 'targets.json', 'toolchain.json'))"
          .venv-wheel/bin/python -c "from warranted.proof_receipts import Proofs, proof_status"
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WARRANTED_CONTAINER_TESTS: "1"
      MSWEA_SILENT_STARTUP: "1"
      WARRANTED_M5_REPORTS: runs/m5-ci
      WARRANTED_M5_RECOVERY: runs/m5-recovery-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Prepare native rootless isolation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv python install
          uv sync --locked
          podman pull "$(uv run --locked python -c 'from warranted.sandbox import IMAGE; print(IMAGE)')"
      - name: Exercise the actual container boundary
        id: containers
        run: uv run --locked pytest -q -m container --durations=5 tests
      - name: Retain M5 migration evidence
        if: ${{ always() && steps.containers.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-migration
          path: |
            runs/m5-ci/reports/
            runs/m5-ci/exports/
            runs/m5-ci/executions.jsonl
            runs/m5-recovery-ci/reports/
            runs/m5-recovery-ci/exports/
            runs/m5-recovery-ci/executions.jsonl
            runs/m5-recovery-ci/worker-dispatches.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Force a restart during the M3 task
        id: m3
        run: |
          set +e
          uv run --locked python examples/m3/demo.py start runs/m3-ci --crash
          task_status=$?
          set -e
          test "$task_status" -eq 137
          uv run --locked python examples/m3/demo.py resume runs/m3-ci
          uv run --locked python examples/m3/demo.py resume runs/m3-ci
      - name: Retain M3 recovery evidence
        if: ${{ always() && steps.m3.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-recovery
          path: |
            runs/m3-ci/reports/
            runs/m3-ci/exports/
            runs/m3-ci/tool-dispatches.jsonl
            runs/m3-ci/executions.jsonl
            runs/m3-ci/service/requests.jsonl
            runs/m3-ci/service/receipts.jsonl
          if-no-files-found: error
          retention-days: 14
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WARRANTED_PROOF_TESTS: "1"
      MSWEA_SILENT_STARTUP: "1"
      WARRANTED_PROOF_BUNDLE: runs/m4-tools/bundle.json
      WARRANTED_PROOF_REPORTS: runs/m4-native
      WARRANTED_M4_REPORTS: runs/m4-demo
      WARRANTED_M5_TREATMENTS: runs/m5-treatments
      XDG_DATA_HOME: ${{ github.workspace }}/runs/podman-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Prepare native proof isolation
        run: |
          command -v podman
          command -v zstd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv python install
          uv sync --locked
      - name: Identify Podman storage version
        id: podman
        run: |
          echo "version=$(podman --version | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
      - name: Restore cached Podman storage archive
        id: podman-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            runs/podman-storage.tar
            runs/m4-tools/bundle.json
          # Bump v1 if the archived storage layout changes.
          key: proof-store-v1-ubuntu-24.04-podman-${{ steps.podman.outputs.version }}-uid-${{ steps.podman.outputs.uid }}-${{ hashFiles('scripts/build_proof_bundle.py', 'src/warranted/containers.py', 'src/warranted/proofs.py', 'src/warranted/proof/**', 'src/warranted/sandbox.py') }}
      - name: Restore verifier image for cache migration
        id: verifier-cache
        if: steps.podman-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            runs/m4-tools/bundle.json
            runs/m4-tools/proof-image.oci
          key: proof-ubuntu-24.04-${{ hashFiles('scripts/build_proof_bundle.py', 'src/warranted/containers.py', 'src/warranted/proofs.py', 'src/warranted/proof/**') }}
      - name: Build the pinned verifier
        if: steps.podman-cache.outputs.cache-hit != 'true' && steps.verifier-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p runs/m4-tools
          uv run --locked python scripts/build_proof_bundle.py runs/m4-tools | tee runs/m4-tools/build.log
      - name: Load the cached pinned verifier
        if: steps.podman-cache.outputs.cache-hit != 'true' && steps.verifier-cache.outputs.cache-hit == 'true'
        run: podman load --input runs/m4-tools/proof-image.oci
      - name: Unpack cached Podman image storage
        if: steps.podman-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p runs/podman-data/containers
          sudo tar --xattrs --xattrs-include='*' --acls --numeric-owner -xf runs/podman-storage.tar -C runs/podman-data/containers
      - name: Prepare the pinned migration runtime
        run: |
          runtime_image="$(uv run --locked python -c 'from warranted.sandbox import IMAGE; print(IMAGE)')"
          if podman image exists "$runtime_image"; then
            :
          else
            image_status=$?
            if [ "$image_status" -ne 1 ]; then exit "$image_status"; fi
            podman pull "$runtime_image"
          fi
          test "$(podman info --format '{{.Store.GraphRoot}}')" = "$GITHUB_WORKSPACE/runs/podman-data/containers/storage"
      - name: Exercise proof verification, isolation, and receipt recovery
        run: |
          uv run --locked pytest -q -n 4 -m proof --durations=5 tests/test_proofs_native.py > /tmp/proofs-native.log 2>&1 &
          native_pid=$!
          uv run --locked pytest -q -m proof --durations=5 tests/test_m4_fixture.py > /tmp/proofs-m4.log 2>&1 &
          m4_pid=$!
          uv run --locked pytest -q -m proof --durations=5 tests/test_m5_treatments.py > /tmp/proofs-m5.log 2>&1 &
          m5_pid=$!
          failed=0
          wait "$native_pid" || failed=1
          wait "$m4_pid" || failed=1
          wait "$m5_pid" || failed=1
          cat /tmp/proofs-native.log /tmp/proofs-m4.log /tmp/proofs-m5.log
          exit "$failed"
      - name: Save native Podman image storage
        if: success() && steps.podman-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar --xattrs --xattrs-include='*' --acls --numeric-owner -cf runs/podman-storage.tar -C runs/podman-data/containers storage
          sudo chown "$(id -u):$(id -g)" runs/podman-storage.tar
      - name: Cache native Podman image storage
        if: success() && steps.podman-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            runs/podman-storage.tar
            runs/m4-tools/bundle.json
          key: ${{ steps.podman-cache.outputs.cache-primary-key }}
      - name: Retain proof reports and exact bundle identities
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-proof-verification
          path: |
            runs/m4-native/
            runs/m4-demo/reports/
            runs/m4-demo/exports/
            runs/m4-demo/proof-executions.jsonl
            runs/m4-demo/executions.jsonl
            runs/m4-tools/bundle.json
            runs/m4-tools/build.log
            runs/m5-treatments/*/reports/
            runs/m5-treatments/*/exports/
            runs/m5-treatments/*/worker-dispatches.jsonl
            runs/m5-treatments/*/proof-executions.jsonl
            runs/m5-treatments/*/executions.jsonl
          if-no-files-found: error
          retention-days: 14
